name: collect
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "실행할 작업 (공백 구분, 비우면 due인 것 전부)"
        required: false
      force:
        description: "주기 무시하고 실행"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: databranch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run collectors
        env:
          DATA_DIR: ${{ github.workspace }}/databranch/data
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="--only ${{ inputs.only }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m collectors.run $ARGS
      - name: Publish data (history 없이 덮어쓰기 → 저장소 용량 유지)
        working-directory: databranch
        run: |
          git config user.name "rescene-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A data
          git commit -q -m "data snapshot $(date -u +%FT%TZ)"
          # GitHub가 가끔 500을 돌려줘서 몇 번 다시 시도한다
          for i in 1 2 3 4; do git push -f origin snapshot:data && exit 0; sleep $((i * 15)); done
          exit 1
      - name: Alert owner if the runner itself broke
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: rescene-hub collect workflow failed" -H "Tags: rotating_light" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "수집 워크플로 자체가 실패했습니다. 로그를 확인해 주세요." "https://ntfy.sh/$NTFY_TOPIC"
      - name: Keepalive (cron은 60일간 활동이 없으면 꺼짐)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "rescene-hub-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi
